name: CI

# Runs on every push to main (builds artifacts) and on pull requests
# (lint + test, no artifacts needed for review).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint + test. Runs on every push and PR.
  # ---------------------------------------------------------------------------
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Lint embedded HTML/JS
        run: node scripts/lint-html.js

  # ---------------------------------------------------------------------------
  # Cross-compile release binaries and attach them to the workflow run.
  # Only on pushes to main (not PRs) to avoid redundant artifact uploads.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: agent_linux
          - goos: windows
            goarch: amd64
            artifact: agent.exe
          - goos: darwin
            goarch: amd64
            artifact: agent_mac_amd
          - goos: darwin
            goarch: arm64
            artifact: agent_mac_arm
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o "bin/${{ matrix.artifact }}" ./src

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
