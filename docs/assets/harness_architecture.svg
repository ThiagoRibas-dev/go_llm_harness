<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'DejaVu Sans', 'Segoe UI', sans-serif;">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#cbd5e1" flood-opacity="0.5" />
  </filter>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
  </marker>
  <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1e293b" />
    <stop offset="100%" stop-color="#0f172a" />
  </linearGradient>
  <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#eff6ff" />
    <stop offset="100%" stop-color="#dbeafe" />
  </linearGradient>
  <linearGradient id="harnessGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f0fdf4" />
    <stop offset="100%" stop-color="#dcfce7" />
  </linearGradient>
  <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#faf5ff" />
    <stop offset="100%" stop-color="#f3e8ff" />
  </linearGradient>
  <linearGradient id="sandboxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fffbeb" />
    <stop offset="100%" stop-color="#fef3c7" />
  </linearGradient>
  <linearGradient id="llmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fff5f5" />
    <stop offset="100%" stop-color="#fee2e2" />
  </linearGradient>
</defs>
<rect x="0" y="0" width="1100" height="85" fill="url(#headerGrad)" />
<text x="30" y="38" font-size="22" font-weight="bold" fill="#f8fafc" letter-spacing="1">GOHARNESS ULTIMATE ARCHITECTURE</text>
<text x="30" y="62" font-size="13" fill="#94a3b8">Complete data flows: Embedded Web GUI, Stdio MCP Child Servers, Turn-by-Turn JSON Files, and Bare-Metal Sandboxing</text>
<line x1="0" y1="85" x2="1100" y2="85" stroke="#3b82f6" stroke-width="3" />
<!-- Boundary boxes -->
<rect x="30" y="105" width="670" height="595" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5" />
<text x="45" y="125" font-size="11" font-weight="bold" fill="#64748b" letter-spacing="0.5">UNSANDBOXED HOST SYSTEM (PRIVILEGED CORE)</text>
<rect x="720" y="105" width="350" height="595" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<rect x="720" y="105" width="350" height="30" rx="8" fill="#e2e8f0" />
<rect x="720" y="120" width="350" height="15" fill="#e2e8f0" />
<text x="895" y="124" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" letter-spacing="0.5">🔒 SANDBOX CAGE ZONE (RESTRICTED GUEST)</text>
<!-- Zone 1: Client Interfaces -->
<rect x="45" y="150" width="220" height="400" rx="10" fill="url(#clientGrad)" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)" />
<rect x="45" y="150" width="220" height="40" rx="10" fill="#2563eb" />
<rect x="46" y="170" width="218" height="20" fill="#2563eb" />
<text x="155" y="175" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. USER INTERFACES</text>
  <rect x="60" y="205" width="190" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="70" y="225" font-size="11" font-weight="bold" fill="#38bdf8">&gt;_ Terminal UI (TUI)</text>
  <text x="70" y="245" font-size="9" fill="#94a3b8">- Interactive Standard Input</text>
  <text x="70" y="260" font-size="9" fill="#94a3b8">- Prints rich ANSI-colored logs</text>
  <text x="70" y="275" font-size="9" fill="#34d399">- Supports /fork rollback cmd</text>
  <text x="70" y="295" font-size="9" fill="#e2e8f0">./agent_linux</text>
  <rect x="60" y="335" width="190" height="195" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="70" y="355" font-size="11" font-weight="bold" fill="#34d399"><i class="fa-solid fa-window-maximize"></i> Web Console (GUI)</text>
  <text x="70" y="375" font-size="9" fill="#94a3b8">- Modern chat conversation feed</text>
  <text x="70" y="390" font-size="9" fill="#94a3b8">- Live streamed assistant output</text>
  <text x="70" y="405" font-size="9" fill="#94a3b8">- Dynamic, visual file explorer tree</text>
  <text x="70" y="420" font-size="9" fill="#94a3b8">- Non-destructive branching modal</text>
  <text x="70" y="435" font-size="9" fill="#94a3b8">- Live token usage &amp; spent dials</text>
  <text x="70" y="450" font-size="9" fill="#38bdf8">- Visual settings panel (config.json)</text>
  <text x="70" y="475" font-size="9" fill="#fbbf24" font-weight="bold">Local Server: Port 8080</text>
  <text x="70" y="490" font-size="9" fill="#fbbf24" font-weight="bold">Communication: SSE Stream</text>
  <text x="70" y="512" font-size="9" fill="#e2e8f0">./agent_linux -web</text>
<!-- Zone 2: GoHarness Binary -->
<rect x="310" y="150" width="350" height="525" rx="10" fill="url(#harnessGrad)" stroke="#86efac" stroke-width="2" filter="url(#shadow)" />
<rect x="310" y="150" width="350" height="40" rx="10" fill="#16a34a" />
<rect x="311" y="170" width="348" height="20" fill="#16a34a" />
<text x="485" y="175" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. GOHARNESS ORCHESTRATOR CORE</text>
  <rect x="325" y="205" width="320" height="85" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="335" y="222" font-size="11" font-weight="bold" fill="#166534">Embedded Web Server &amp; SSE Broadcaster</text>
  <text x="335" y="240" font-size="10" fill="#475569">- Standard net/http server loaded via //go:embed</text>
  <text x="335" y="255" font-size="10" fill="#475569">- Stream endpoints: /stream, /api/prompt, /api/fork</text>
  <text x="335" y="270" font-size="10" fill="#15803d" font-weight="bold">- Broadcasts turns, compactions, &amp; costs live</text>
  <rect x="325" y="305" width="320" height="90" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="335" y="322" font-size="11" font-weight="bold" fill="#166534">Harness Orchestration Loop Manager</text>
  <text x="335" y="340" font-size="10" fill="#475569">- Injects local guidelines (AGENTS.md, SKILLS.md)</text>
  <text x="335" y="355" font-size="10" fill="#475569">- Token-Safe Auto-LS tree scanning &amp; metadata check</text>
  <text x="335" y="370" font-size="10" fill="#475569">- Limits turns, tracks API usage, and captures telemetry</text>
  <text x="335" y="385" font-size="10" fill="#15803d" font-weight="bold">- Decodes JSON-RPC &amp; routes native vs MCP tool calls</text>
  <rect x="325" y="410" width="320" height="85" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="335" y="427" font-size="11" font-weight="bold" fill="#166534">Sliding-Window Context Compactor</text>
  <text x="335" y="445" font-size="10" fill="#475569">- Triggers when uncompacted history &gt; threshold</text>
  <text x="335" y="460" font-size="10" fill="#475569">- Compacts turns 1 to X, leaving last N turns raw</text>
  <text x="335" y="475" font-size="10" fill="#15803d" font-weight="bold">- Dynamically reconstructs sliding-window prompt state</text>
  <rect x="325" y="510" width="320" height="150" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="335" y="527" font-size="11" font-weight="bold" fill="#166534">Observable Storage &amp; VCS (Disk)</text>
  <text x="335" y="545" font-size="10" fill="#1e293b" font-weight="bold">📂 .goharness/sessions/sess_XYZ/</text>
  <text x="345" y="562" font-size="9" fill="#475569">├── 001-user-[timestamp].json</text>
  <text x="345" y="575" font-size="9" fill="#475569">├── 002-assistant-[timestamp].json</text>
  <text x="345" y="588" font-size="9" fill="#475569">├── meta.json  (session descriptors, parent IDs)</text>
  <text x="345" y="601" font-size="9" fill="#475569">└── backups/turn-X/  (unmodified file stashes)</text>
  <text x="335" y="618" font-size="10" fill="#1e293b" font-weight="bold">📄 config.json  |  .goharness/traces.jsonl</text>
  <text x="335" y="635" font-size="9" fill="#15803d" font-weight="bold">- Forking copies backups back to workspace / Git resets</text>
<!-- Zone 3: Remote LLM API -->
<rect x="740" y="150" width="310" height="120" rx="10" fill="url(#llmGrad)" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)" />
<rect x="740" y="150" width="310" height="40" rx="10" fill="#ef4444" />
<rect x="741" y="170" width="308" height="20" fill="#ef4444" />
<text x="895" y="175" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. CLOUD / LOCAL LLM API</text>
  <rect x="755" y="200" width="280" height="55" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="765" y="217" font-size="10" font-weight="bold" fill="#7f1d1d">OpenAI, Anthropic, or Local Ollama</text>
  <text x="765" y="235" font-size="9" fill="#475569">- Processes prompts &amp; returns text thoughts/tool calls</text>
<!-- Zone 4: MCP Servers -->
<rect x="740" y="295" width="310" height="180" rx="10" fill="url(#mcpGrad)" stroke="#c084fc" stroke-width="2" filter="url(#shadow)" />
<rect x="740" y="295" width="310" height="40" rx="10" fill="#a855f7" />
<rect x="741" y="315" width="308" height="20" fill="#a855f7" />
<text x="895" y="320" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4. LOCAL MCP CHILD SERVERS</text>
  <rect x="755" y="345" width="280" height="115" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
  <text x="765" y="362" font-size="10" font-weight="bold" fill="#581c87">JSON-RPC 2.0 over Stdio pipes (No ports open!)</text>
  <text x="765" y="380" font-size="9" fill="#475569">- Spawns servers (e.g. SQLite, Brave Search, GitHub)</text>
  <text x="765" y="395" font-size="9" fill="#475569">- Queries tools/list to dynamically import schemas</text>
  <text x="765" y="410" font-size="9" fill="#475569">- Routes tools/call requests on demand</text>
  <text x="765" y="430" font-size="9" fill="#7e22ce" font-weight="bold">- Lifetime managed automatically by parent binary</text>
<!-- Zone 5: Secured Sandbox Zone -->
<rect x="740" y="500" width="310" height="175" rx="10" fill="url(#sandboxGrad)" stroke="#fef08a" stroke-width="2" filter="url(#shadow)" />
<rect x="740" y="500" width="310" height="40" rx="10" fill="#eab308" />
<rect x="741" y="520" width="308" height="20" fill="#eab308" />
<text x="895" y="525" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5. SECURED SANDBOX WORKSPACE</text>
  <rect x="755" y="550" width="280" height="110" rx="6" fill="#ffffff" stroke="#fef08a" stroke-width="1" />
  <text x="765" y="567" font-size="11" font-weight="bold" fill="#854d0e">Bare-Metal Secure Cage</text>
  <text x="765" y="585" font-size="9" fill="#475569">- Linux: Landlock LSM (sys_restrict_self)</text>
  <text x="765" y="598" font-size="9" fill="#475569">- macOS: Apple sandbox-exec SBPL profile</text>
  <text x="765" y="611" font-size="9" fill="#475569">- Windows: Job Objects &amp; Low-Integrity Tokens</text>
  <text x="765" y="630" font-size="9" fill="#1e3a8a" font-weight="bold">AUTHORIZED ZONE: ./workspace/</text>
  <text x="765" y="643" font-size="9" fill="#b91c1c" font-weight="bold">SYSTEM PROTECTION SHIELD: Blocks .goharness edits</text>
<!-- Connectors -->
  <path d="M 265,432 C 290,432 290,250 310,250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="254" y="325" width="60" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="284" y="337" font-size="8" font-weight="bold" fill="#2563eb" text-anchor="middle">1. Prompt</text>
  <text x="284" y="347" font-size="7" fill="#475569" text-anchor="middle">POST HTTP</text>
  <path d="M 265,260 L 308,260" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 660,350 C 700,350 700,210 738,210" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="670" y="258" width="60" height="26" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="700" y="270" font-size="8" font-weight="bold" fill="#2563eb" text-anchor="middle">2. Request</text>
  <text x="700" y="280" font-size="7" fill="#475569" text-anchor="middle">HTTPS JSON</text>
  <path d="M 740,230 C 710,230 710,360 662,360" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />
  <rect x="670" y="310" width="60" height="26" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
  <text x="700" y="322" font-size="8" font-weight="bold" fill="#d97706" text-anchor="middle">3. Reply</text>
  <text x="700" y="332" font-size="7" fill="#475569" text-anchor="middle">ToolCalls[]</text>
  <path d="M 660,370 L 738,370" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />
  <rect x="672" y="380" width="55" height="26" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
  <text x="700" y="392" font-size="8" font-weight="bold" fill="#d97706" text-anchor="middle">4a. MCP Call</text>
  <text x="700" y="402" font-size="7" fill="#475569" text-anchor="middle">Stdio Pipe</text>
  <path d="M 660,380 C 700,380 700,560 738,560" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />
  <rect x="670" y="445" width="60" height="26" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
  <text x="700" y="457" font-size="8" font-weight="bold" fill="#d97706" text-anchor="middle">4b. Execute</text>
  <text x="700" y="467" font-size="7" fill="#475569" text-anchor="middle">Bare-Metal</text>
  <path d="M 740,390 C 710,390 715,640 655,640" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-red)" />
  <path d="M 740,630 C 710,630 685,630 655,630" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-red)" />
  <rect x="670" y="580" width="60" height="26" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="700" y="592" font-size="8" font-weight="bold" fill="#ef4444" text-anchor="middle">5. Feedback</text>
  <text x="700" y="602" font-size="7" fill="#475569" text-anchor="middle">Stdout/File</text>
  <path d="M 310,230 C 285,230 280,390 265,390" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="254" y="240" width="60" height="26" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="284" y="252" font-size="8" font-weight="bold" fill="#16a34a" text-anchor="middle">6. Stream</text>
  <text x="284" y="262" font-size="7" fill="#475569" text-anchor="middle">SSE Event</text>
  <rect x="30" y="705" width="1040" height="30" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="40" y="723" font-size="10" fill="#64748b">• 1. Input prompts from CLI/GUI ➔ • 2. Dispatched to LLM with guidelines ➔ • 3. LLM returns ToolCalls ➔ • 4. Orchestrator routes execution to MCP or Sandbox ➔ • 5. Outputs saved to JSON turns &amp; feedback to history ➔ • 6. Browser UI updated live</text>
</svg>