                                <button type="button" data-add-node-kind="conditional_router" class="w-full text-left px-3 py-2 hover:bg-slate-800 text-slate-200 flex items-center"><i class="fa-solid fa-route w-5 text-amber-400"></i> Conditional Router</button>

                        </div>

                            <i class="fa-solid fa-arrows-rotate text-[10px]"></i><span>Reload JSON</span>
